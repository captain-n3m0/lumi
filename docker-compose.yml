services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumi_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - OPENSEA_API_KEY=${OPENSEA_API_KEY:-}
      - ETH_RPC_URL=${ETH_RPC_URL:-}
      - BASE_RPC_URL=${BASE_RPC_URL:-}
      - ARB_RPC_URL=${ARB_RPC_URL:-}
      - OPTIMISM_RPC_URL=${OPTIMISM_RPC_URL:-}
      - POLYGON_RPC_URL=${POLYGON_RPC_URL:-}
      - BLAST_RPC_URL=${BLAST_RPC_URL:-}
      - BSC_RPC_URL=${BSC_RPC_URL:-}
      - ZORA_RPC_URL=${ZORA_RPC_URL:-}
      - AVALANCHE_RPC_URL=${AVALANCHE_RPC_URL:-}
      - LINEA_RPC_URL=${LINEA_RPC_URL:-}
      - SCROLL_RPC_URL=${SCROLL_RPC_URL:-}
      - MANTLE_RPC_URL=${MANTLE_RPC_URL:-}
      - MODE_RPC_URL=${MODE_RPC_URL:-}
      - BERACHAIN_RPC_URL=${BERACHAIN_RPC_URL:-}
      - APECHAIN_RPC_URL=${APECHAIN_RPC_URL:-}
      - SEI_RPC_URL=${SEI_RPC_URL:-}
      - INK_RPC_URL=${INK_RPC_URL:-}
      - MONAD_RPC_URL=${MONAD_RPC_URL:-}
      - SEPOLIA_RPC_URL=${SEPOLIA_RPC_URL:-}
    networks:
      - lumi_network
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2048M
        reservations:
          cpus: "0.50"
          memory: 512M

networks:
  lumi_network:
    driver: bridge
